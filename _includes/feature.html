<div
  class="feature"
  {% if include.flip %}
    data-flip
  {% endif %}
  {% if include.fit %}
    data-fit="{{ include.fit }}"
  {% endif %}
  {% if include.video %}
    data-video
  {% endif %}
>
  <a
    {% if include.link %}
      href="{{ include.link | relative_url }}" 
    {% endif %}
    class="feature-image"
    aria-label="{{ include.title | default: "feature link" }}"
    {% if include.video %}
      style="--poster: url('{{ include.image | relative_url }}'); {% if include.ratio %}aspect-ratio: {{ include.ratio }};{% endif %}"
    {% endif %}
  >
    {% if include.video %}
      <video
        src="{{ include.video | relative_url }}"
        poster="{{ include.image | relative_url }}"
        muted
        loop
        playsinline
        preload="none"
        data-lazy-video
        aria-label="{{ include.title | default: "feature video" }}"
      ></video>
    {% else %}
      <img
        src="{{ include.image | relative_url }}"
        loading="lazy"
        alt="{{ include.title | default: "feature image" }}"
        {% include fallback.html %}
      >
    {% endif %}
  </a>
  <div class="feature-text">
    {% if include.title %}
      <p class="feature-title">{{ include.title }}</p>
    {% endif %}
    {{ include.text | markdownify }}
  </div>
</div>
